name: guji-patch-planner

services:
  app:
    build: .
    image: guji-patch-planner:latest
    ports:
      # 宿主机端口可通过环境变量 HOST_PORT 配置，默认 8080
      - "${HOST_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # 一次性验证服务：自动执行代码测试、构建检查与 API 冒烟，以退出码报告结果。
  # 用法：docker compose up --build --exit-code-from verify verify
  verify:
    build: .
    image: guji-patch-planner:latest
    command: ["bash", "scripts/verify.sh"]
    environment:
      API_BASE: http://app:8000
    depends_on:
      app:
        condition: service_healthy
    restart: "no"
